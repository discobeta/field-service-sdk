mutation ValidateAddress($input: AddressValidationInput!) {
  validateAddress(input: $input) {
  validationResult {
    isValid
    formattedAddress
    placeId
    location {
      lat
      lng
    }
    addressComponents {
      streetAddress
      city
      state
      postalCode
      country
    }
    rawComponents
    message
  }
  success
  message
  }
}