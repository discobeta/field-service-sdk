overwrite: true
schema: 
  - "./src/schema/schema.graphql"
documents: "./src/generated/**/*.graphql"
generates:
  src/generated/graphql.ts:
    plugins:
      - "typescript"
      - "typescript-operations"
      - "typescript-react-apollo"
    config:
      withHooks: true
      withComponent: false
      withHOC: false
      avoidOptionals: true
      skipTypename: false
      outputFile: "./src/generated/graphql.ts" 