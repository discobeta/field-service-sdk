mutation CreateClient($input: ClientInput!) {
  createClient(input: $input) {
  client {
    id
    createdAt
    updatedAt
    account
    createdBy
    name
    email
    phone
    address1
    address2
    city
    state
    zipCode
    notes
    locationLatitude
    locationLongitude
    jobs
  }
  success
  message
  }
}