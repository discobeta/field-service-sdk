mutation UpdateJob($id: ID!, $input: JobInput!) {
  updateJob(id: $id, input: $input) {
  job {
    id
    createdAt
    updatedAt
    account
    createdBy
    assignedTo
    client
    title
    description
    status
    scheduledDate
    dueDate
    estimates
    invoices
  }
  success
  message
  }
}