query MyInvitations {
  myInvitations {
  id
  status
  email
  token
  invitedBy {
    id
    email
    firstName
    lastName
  }
  account {
    id
    name
    isActive
    subscriptionPlan {
      id
      name
      description
      price
      currency
      period
      trialPeriodDays
      isActive
      maxJobs
      maxClients
      maxTeamMembers
      createdAt
      updatedAt
    }
    subscriptionEndDate
    members {
      isAdmin
      id
      createdAt
      updatedAt
    }
    createdAt
    updatedAt
  }
  createdAt
  updatedAt
  }
}