query Client($id: ID!) {
  client(id: $id) {
  id
  createdAt
  updatedAt
  name
  email
  phone
  address1
  address2
  city
  state
  zipCode
  notes
  locationLatitude
  locationLongitude
  jobs {
    id
    createdAt
    updatedAt
    title
    description
    status
    scheduledDate
    dueDate
    estimates {
      id
      createdAt
      updatedAt
      date
      status
      total
      applyTaxes
      lineItems {
        id
        createdAt
        updatedAt
        title
        description
        price
        type
        taxType
      }
    }
    invoices {
      id
      createdAt
      updatedAt
      date
      dueDate
      status
      total
      applyTaxes
      lineItems {
        id
        createdAt
        updatedAt
        title
        description
        price
        type
        taxType
      }
    }
  }
  pk
  address1
  address2
  zipCode
  locationLatitude
  locationLongitude
  }
}